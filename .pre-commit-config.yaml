repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: ruff check --fix
        types: [python]
        pass_filenames: true
      - id: ruff-format
        name: ruff format
        language: system
        entry: ruff format
        types: [python]
        pass_filenames: true

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.7
          - pydantic-settings>=2.0
          - structlog>=25.0
          - pytest>=8.0
          - pytest-asyncio>=1.3.0
          - httpx>=0.28.1
          - redis[hiredis]>=7.4.0
          - qdrant-client>=1.17.1
          - testcontainers>=4.14.2
        args: [--strict]
