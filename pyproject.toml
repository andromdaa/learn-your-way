[project]
name = "learn-your-way-oss"
version = "0.0.1"
description = "Self-hosted, single-user replica of Google's Learn Your Way."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "arq>=0.25.0,<0.26",  # pinned: arq 0.26+ requires redis[hiredis]<6
    "docling>=2.92.0",
    "fastapi>=0.136.1",
    "haystack-ai>=2.28.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.27",
    "qdrant-client>=1.17.1",
    "redis[hiredis]>=7.4.0",
    "sentence-transformers>=5.4.1",
    "structlog>=25.5.0",
    "textstat>=0.7,<0.8",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/lesson_graph",
    "src/lyw_core",
    "src/lyw_web",
]

# ----- Tooling configuration ------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]
ignore = [
    "E501", # handled by formatter
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/lyw_core", "src/lyw_web", "src/lesson_graph", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lyw_core.healthcheck"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "fpdf.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "textstat.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: marks tests that require external services or end-to-end integration paths",
]
filterwarnings = [
    # testcontainers 4.x uses @wait_container_is_ready and wait_for_logs internally
    "ignore::DeprecationWarning:testcontainers\\..*",
    # docling 2.92 emits DeprecationWarnings from internal default field values we cannot override
    "ignore::DeprecationWarning:docling\\..*",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
fail_under = 93

[dependency-groups]
dev = [
    "hypothesis>=6.152.4",
    "pre-commit>=4.6.0",
    "pytest-asyncio>=1.3.0",
    "syrupy>=5.1.0",
    "testcontainers>=4.14.2",
]
