# Development overrides — applied automatically by `docker compose up`.
# Mounts the local source tree into running containers so code changes are
# reflected without rebuilding the image.
services:
  api:
    command: uvicorn lyw_core.api.app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src
      - lyw_data:/data
    environment:
      - LYW_LOG_FORMAT=console

  worker:
    volumes:
      - ./src:/app/src
      - lyw_data:/data
    environment:
      - LYW_LOG_FORMAT=console
