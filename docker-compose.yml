services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4.3-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  ollama:
    image: ollama/ollama:0.22.0
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.9.2
    ports:
      - "3030:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: .
    command: uvicorn lyw_core.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - lyw_data:/data
    environment:
      - LYW_REDIS_URL=redis://redis:6379/0
      - LYW_QDRANT_URL=http://qdrant:6333
      - LYW_OLLAMA_BASE_URL=http://ollama:11434
      - LYW_DATA_DIR=/data
      - LYW_DB_PATH=/data/lyw.db
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: arq lyw_core.worker.settings.WorkerSettings
    volumes:
      - lyw_data:/data
    environment:
      - LYW_REDIS_URL=redis://redis:6379/0
      - LYW_QDRANT_URL=http://qdrant:6333
      - LYW_OLLAMA_BASE_URL=http://ollama:11434
      - LYW_DATA_DIR=/data
      - LYW_DB_PATH=/data/lyw.db
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
  open_webui_data:
  lyw_data:
